name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4 # Päivitetty v3 -> v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Päivitetty v4 -> v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: pyinstaller --onefile --noconsole lautajako_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # TÄMÄ OLI KRIITTINEN KORJAUS v3 -> v4
        with:
          name: valmis-ohjelma
          path: dist/lautajako_gui.exe
